data:
  root: ../datasets/EV-IMO/eval
  train_sequences:
    - box/npz/seq_00.npz
  val_sequences:
    - tabletop/npz/seq_00.npz
  seq_len: 16
  nb_time_bins: 5
  patch_size: 4
  mask_thicken_radius: 3

model:
  name: convlstm_v4
  hidden_dim: 96
  num_groups: 8

training:
  epochs: 3
  batch_size: 2
  lr: 1.0e-3
  loss: bce_dice
  loss_pos_weight: 10.0
  num_workers: 0
  checkpoint_dir: checkpoints

wandb:
  project: ms-model
  entity: arthurfou-cole-polytechnique
  name: ""
